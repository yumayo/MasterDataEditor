services:
  dev:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    working_dir: /app
    volumes:
      - ./build.ts:/app/build.ts:ro
      - ./.env:/app/.env:ro
      # C# ソースはイメージ内にCOPY済み（WPFビルドが一時ファイルを書くためマウント不可）
      - ./WebView/src/:/app/WebView/src/:ro
      - ./WebView/index.html:/app/WebView/index.html:ro
      - ./WebView/index.css:/app/WebView/index.css:ro
      - ./WebView/vite.config.ts:/app/WebView/vite.config.ts:ro
      - ./WebView/tsconfig.json:/app/WebView/tsconfig.json:ro
      - ./dist:/app/dist
    environment:
      - NODE_ENV=production
    entrypoint: ["node", "build.ts"]

  playwright:
    build:
      context: .
      dockerfile: docker/playwright/Dockerfile
    working_dir: /app/WebView
    volumes:
      # ソースコード（読み取り専用）
      # src/ 配下のCSS・TSファイルはすべて含まれる
      - ./WebView/src/:/app/WebView/src/:ro
      - ./WebView/index.html:/app/WebView/index.html:ro
      - ./WebView/index.css:/app/WebView/index.css:ro
      - ./WebView/vite.config.ts:/app/WebView/vite.config.ts:ro
      - ./WebView/tsconfig.json:/app/WebView/tsconfig.json:ro
      # テスト用config.json（src/config.jsonはgitignoreされているため）
      - ./WebView/e2e/fixtures/config.json:/app/WebView/src/config.json:ro
      # Playwright設定・テストファイル
      - ./WebView/playwright.config.ts:/app/WebView/playwright.config.ts:ro
      - ./WebView/e2e/:/app/WebView/e2e/
      # DOM確認用にマウントします。
      - ./.CONTEXT:/app/.CONTEXT
    networks:
      - internal_net
    tty: true
    stop_grace_period: 0s

networks:
  internal_net:
    driver: bridge
    internal: true
