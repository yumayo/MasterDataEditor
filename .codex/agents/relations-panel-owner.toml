name = "relations-panel-owner"
description = "Use this agent when working on `relations-panel.ts` or any feature/bugfix involving the RelationsPanel class. This includes: displaying N:1 referenced tables and 1:N referencing tables for the selected row, expanding editable mini EditorTables, propagating mini-table edits back to the parent table, breadcrumb navigation, resize handle behavior, async race condition fixes (currentRequestId pattern), and FK auto-fill logic. Also use when coordinating changes that touch the boundary between RelationsPanel and EditorTable (row selection notifications, cell change notifications) or between RelationsPanel and the in-memory table store (data sync).\\n\\nExamples:\\n\\n- user: \"右ペインで1:Nテーブルの行を追加したとき、FK値が自動で埋まらないバグを修正して\"\\n  assistant: \"RelationsPanelのFK自動埋め込み機能に関する不具合ですね。relations-panel-owner エージェントを起動して調査・修正を進めます。\"\\n  <commentary>FK auto-fill is a core RelationsPanel responsibility (autoFillEntries + applyAutoFillToRow). Use the relations-panel-owner agent, which will coordinate with in-memory-table-store agent for data integrity and editor-table-integrator agent for parent table reflection.</commentary>\\n\\n- user: \"ミニテーブルでセルを編集したとき、左ペインの参照ヒントが更新されない\"\\n  assistant: \"ミニテーブルからの変更通知フロー（notifyMiniTableCellChanged）の問題ですね。relations-panel-owner エージェントに任せます。\"\\n  <commentary>This involves the mini-table → parent table notification flow which is RelationsPanel's responsibility. The agent will coordinate with editor-table-integrator for the left pane update.</commentary>\\n\\n- user: \"パンくずリストをクリックしたとき、非同期で古いデータが表示されることがある\"\\n  assistant: \"非同期競合の問題ですね。relations-panel-owner エージェントで currentRequestId パターンの適用を確認します。\"\\n  <commentary>Async race condition in breadcrumb navigation is a core RelationsPanel concern. Use the relations-panel-owner agent which enforces the currentRequestId guard pattern.</commentary>\\n\\n- user: \"RelationsPanelに新しいテーブルフィルタ機能を追加したい\"\\n  assistant: \"RelationsPanelの新機能開発ですね。relations-panel-owner エージェントを起動して、チーム連携しながらTDDで実装を進めます。\"\\n  <commentary>New feature development on RelationsPanel. The agent will coordinate with editor-table-integrator and in-memory-table-store agents as needed.</commentary>"
